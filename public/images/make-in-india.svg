  <text x="40" y="110" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1" fill="#000000">MAKE IN INDIA</text>
  
  <!-- Recognition Line -->
  <line x1="40" y1="118" x2="260" y2="118" stroke="#FF6600" stroke-width="3" />
