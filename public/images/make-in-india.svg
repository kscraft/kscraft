    <path d="M85,50 l10,0 l0,20 l-10,0 Z" /> <!-- Simplified Gear Element -->
    <path d="M100,45 l15,0 l0,30 l-15,0 Z" /> <!-- Simplified Gear Element -->
    <path d="M120,40 l20,0 l0,40 l-20,0 Z" /> <!-- Simplified Gear Element -->
    <path d="M150,35 l30,0 l0,50 l-30,0 Z" /> <!-- Large Body Gear -->
    <path d="M190,45 l20,0 l-10,25 Z" /> <!-- Rear Leg Gear -->
    <path d="M220,50 l15,0 l-5,20 Z" /> <!-- Tail Gear -->
    
